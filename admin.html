<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCOS DESK v10.8 - Admin Control Center</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --arcos-black: #000000;
      --arcos-yellow: #FFC000;
      --arcos-yellow-dark: #E0A800;
      --bg-dark: #0A0A0A;
      --card-bg: #121212;
      --border-color: #262626;
      --text-white: #FFFFFF;
      --text-muted: #8E8E8E;
      --green-success: #10B981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body { 
      background: var(--arcos-black); 
      color: var(--text-white); 
      min-height: 100vh; 
    }

    /* Admin Navbar - ARCOS DESK V10.8 Style */
    .navbar {
      background: var(--arcos-black);
      color: var(--text-white);
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid var(--arcos-yellow);
    }
    
    .nav-brand { display: flex; align-items: center; gap: 14px; }
    .nav-brand h1 { 
      font-size: 20px; 
      font-weight: 900; 
      letter-spacing: 0.5px; 
      color: var(--text-white);
    }
    .nav-brand h1 span { color: var(--arcos-yellow); }

    /* Tabs Bar */
    .tab-bar {
      background: var(--bg-dark);
      border-bottom: 1px solid var(--border-color);
      padding: 0 30px;
      display: flex;
      gap: 20px;
    }
    
    .tab-item {
      padding: 16px 14px;
      font-weight: 800;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      letter-spacing: 0.5px;
      transition: all 0.2s;
    }

    .tab-item.active { 
      color: var(--arcos-yellow); 
      border-bottom-color: var(--arcos-yellow); 
      background: rgba(255, 192, 0, 0.05);
    }

    .tab-item:hover:not(.active) {
      color: var(--text-white);
    }

    /* Container & Card Layout */
    .container { padding: 30px; max-width: 1250px; margin: 0 auto; }
    
    .card { 
      background: var(--card-bg); 
      border-radius: 14px; 
      border: 1px solid var(--border-color); 
      padding: 24px; 
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .card h3 {
      color: var(--arcos-yellow);
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 15px;
      letter-spacing: 0.5px;
      border-left: 4px solid var(--arcos-yellow);
      padding-left: 10px;
    }

    /* Table Styling */
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    
    th { 
      background: var(--arcos-yellow); 
      padding: 14px 12px; 
      text-align: left; 
      font-size: 11px; 
      text-transform: uppercase; 
      color: var(--arcos-black); 
      font-weight: 900;
      letter-spacing: 0.5px;
    }
    
    td { 
      padding: 14px 12px; 
      font-size: 13px; 
      border-bottom: 1px solid var(--border-color); 
      color: var(--text-white);
    }

    tr:hover {
      background: rgba(255, 192, 0, 0.02);
    }

    /* Badges */
    .badge-open { 
      background: rgba(255, 192, 0, 0.15); 
      color: var(--arcos-yellow); 
      border: 1px solid var(--arcos-yellow);
      padding: 4px 8px; 
      border-radius: 6px; 
      font-weight: 800; 
      font-size: 10px; 
    }
    
    .badge-resolved { 
      background: rgba(16, 185, 129, 0.15); 
      color: var(--green-success); 
      border: 1px solid var(--green-success);
      padding: 4px 8px; 
      border-radius: 6px; 
      font-weight: 800; 
      font-size: 10px; 
    }

    /* Action Buttons */
    .btn-resolve { 
      padding: 8px 14px; 
      background: var(--arcos-yellow); 
      color: var(--arcos-black); 
      border: none; 
      border-radius: 6px; 
      font-weight: 800; 
      font-size: 11px;
      cursor: pointer; 
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .btn-resolve:hover {
      background: var(--arcos-yellow-dark);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <div class="navbar">
    <div class="nav-brand">
      <svg width="32" height="32" viewBox="0 0 100 100" fill="none">
        <path d="M50 15 C30 15 20 35 20 50 C20 70 35 85 50 85 C65 85 80 70 80 50" stroke="#FFC000" stroke-width="12" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="8" fill="#ffffff"/>
      </svg>
      <h1>ARCOS <span>DESK v10.8</span> - CONTROL CENTER</h1>
    </div>
  </div>

  <!-- Tabs Navigation -->
  <div class="tab-bar">
    <div class="tab-item active" onclick="switchTab('queries')">🚨 STAFF QUERIES</div>
  </div>

  <!-- Main Work Area -->
  <div class="container">
    <div class="card" id="queriesSection">
      <h3>Staff Raised Queries & Attendance Tickets</h3>
      <table>
        <thead>
          <tr>
            <th>Ticket ID</th>
            <th>Emp ID</th>
            <th>Target Date</th>
            <th>Issue Note</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="queriesBody">
          <tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Loading queries...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Backend Integration Logic -->
  <script>
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxmZTB0kT0aiMhu0ah1cICCo-MwWdrUS_CsRX6WGHIsLINWL3kkF6Bv7g4zsjiIqF-h/exec';

    async function loadQueries() {
      const tbody = document.getElementById('queriesBody');
      try {
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getAdminQueries`);
        const data = await res.json();

        if (data.success && data.queries.length > 0) {
          tbody.innerHTML = '';
          data.queries.forEach(q => {
            let badge = q.status === 'OPEN' ? `<span class="badge-open">OPEN</span>` : `<span class="badge-resolved">RESOLVED</span>`;
            let actionBtn = q.status === 'OPEN' ? `<button class="btn-resolve" onclick="resolveTicket('${q.ticketId}')">Mark Resolved</button>` : 'N/A';

            tbody.innerHTML += `
              <tr>
                <td><b style="color: var(--arcos-yellow);">${q.ticketId}</b></td>
                <td>${q.empId}</td>
                <td>${q.date}</td>
                <td>${q.issue}</td>
                <td>${badge}</td>
                <td>${actionBtn}</td>
              </tr>
            `;
          });
        } else { 
          tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">No pending queries found.</td></tr>'; 
        }
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #EF4444;">Error loading queries. Check URL / Connection.</td></tr>';
      }
    }

    async function resolveTicket(ticketId) {
      const res = await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'resolveQuery', ticketId: ticketId })
      });
      const data = await res.json();
      if (data.success) {
        alert("Ticket Marked Resolved!");
        loadQueries();
      }
    }

    loadQueries();
  </script>
</body>
</html>
