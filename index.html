<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCOS Staff Portal - Attendance</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --arcos-black: #000000;
      --arcos-yellow: #FFC000;
      --arcos-yellow-dark: #E0A800;
      --bg-dark: #0A0A0A;
      --card-bg: #121212;
      --border-color: #262626;
      --text-white: #FFFFFF;
      --text-muted: #8E8E8E;
      --danger: #EF4444;
      --success: #10B981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background: var(--arcos-black);
      color: var(--text-white);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .app-card {
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255, 192, 0, 0.2);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
      border: 2px solid var(--arcos-yellow);
    }

    /* Header Design */
    .app-header {
      background: var(--arcos-black);
      padding: 22px 20px;
      text-align: center;
      color: var(--text-white);
      border-bottom: 3px solid var(--arcos-yellow);
    }

    .brand-logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 4px;
    }

    .arcos-svg-logo {
      width: 32px;
      height: 32px;
      filter: drop-shadow(0 2px 4px rgba(255, 192, 0, 0.4));
    }

    .app-header h2 {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: var(--text-white);
    }

    .app-header p {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--arcos-yellow);
      text-transform: uppercase;
    }

    .app-body { padding: 22px; }

    /* Inputs */
    .input-group { margin-bottom: 16px; }
    .input-group label { 
      display: block; 
      font-size: 11px; 
      font-weight: 800; 
      color: var(--text-muted); 
      margin-bottom: 6px; 
      text-transform: uppercase; 
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      background: #1A1A1A;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-white);
      outline: none;
      transition: all 0.2s;
    }
    input:focus { border-color: var(--arcos-yellow); box-shadow: 0 0 10px rgba(255, 192, 0, 0.3); }

    /* Buttons */
    .btn-action {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: var(--arcos-yellow);
      color: var(--arcos-black);
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(255, 192, 0, 0.3);
    }
    .btn-action:hover { background: var(--arcos-yellow-dark); transform: translateY(-1px); }
    .btn-action:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-out { 
      background: var(--danger); 
      color: var(--text-white); 
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); 
    }
    .btn-out:hover { background: #DC2626; }

    /* Live Clock */
    .clock-badge {
      background: rgba(255, 192, 0, 0.12);
      border: 1px solid var(--arcos-yellow);
      color: var(--arcos-yellow);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 20px;
    }

    /* CIRCULAR CAMERA */
    #cameraBox {
      display: none;
      margin: 15px auto 25px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      border: 4px solid var(--arcos-yellow);
      box-shadow: 0 0 25px rgba(255, 192, 0, 0.5);
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    #timer {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      font-size: 56px;
      color: var(--arcos-yellow);
      font-weight: 900;
      text-shadow: 0 4px 12px rgba(0,0,0,0.9);
    }
    canvas { display: none; }

    /* Today Summary Box */
    .today-card {
      background: #181818;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      margin-top: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .today-stat { text-align: center; }
    .today-stat span { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }
    .today-stat strong { display: block; font-size: 16px; font-weight: 900; color: var(--arcos-yellow); margin-top: 4px; }

    /* Roster Trigger Button */
    .btn-roster {
      width: 100%;
      padding: 14px;
      background: var(--arcos-yellow);
      color: var(--arcos-black);
      font-weight: 900;
      font-size: 12px;
      border: none;
      border-radius: 10px;
      margin-top: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .btn-roster:hover { background: var(--arcos-yellow-dark); }

    /* Footer */
    .app-footer {
      background: var(--arcos-yellow);
      border-top: 1px solid var(--arcos-yellow);
      padding: 12px;
      text-align: center;
      font-size: 10px;
      font-weight: 900;
      color: var(--arcos-black);
      letter-spacing: 0.5px;
    }

    /* Modal / Calendar Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-content {
      background: var(--card-bg);
      border-radius: 18px;
      width: 100%;
      max-width: 400px;
      padding: 20px;
      border: 2px solid var(--arcos-yellow);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .modal-header h3 { font-size: 16px; font-weight: 900; color: var(--arcos-yellow); }
    .close-btn { font-size: 24px; font-weight: 900; cursor: pointer; color: var(--danger); }

    /* Calendar Grid */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .cal-head { text-align: center; font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; padding: 4px; }
    
    .cal-day {
      background: #181818;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      min-height: 50px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-white);
    }
    
    /* Status Badges */
    .cal-day.present { background: rgba(16, 185, 129, 0.1); border-color: var(--success); cursor: pointer; }
    .cal-day.absent { background: rgba(239, 68, 68, 0.1); border-color: var(--danger); }
    .cal-day.disabled { opacity: 0.3; cursor: not-allowed; background: #0A0A0A; }

    .badge-status {
      font-size: 8px;
      padding: 2px 4px;
      border-radius: 4px;
      font-weight: 900;
      text-transform: uppercase;
      width: 100%;
      text-align: center;
    }
    .badge-p { background: var(--success); color: var(--text-white); }
    .badge-a { background: var(--danger); color: var(--text-white); }

    /* Detail Card */
    .detail-card {
      margin-top: 16px;
      background: #181818;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
    }
    .detail-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 12px; }
    .detail-thumb { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--arcos-yellow); }

    .btn-query {
      width: 100%;
      padding: 10px;
      background: rgba(255, 192, 0, 0.15);
      border: 1px dashed var(--arcos-yellow);
      color: var(--arcos-yellow);
      font-size: 11px;
      font-weight: 800;
      border-radius: 8px;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <!-- Corporate Header -->
    <div class="app-header">
      <div class="brand-logo-container">
        <svg class="arcos-svg-logo" viewBox="0 0 100 100" fill="none">
          <path d="M50 15 C30 15 20 35 20 50 C20 70 35 85 50 85 C65 85 80 70 80 50" stroke="#FFC000" stroke-width="12" stroke-linecap="round"/>
          <path d="M15 75 C35 90 75 80 85 45 C95 10 65 5 45 25" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
          <circle cx="50" cy="50" r="8" fill="#FFC000"/>
        </svg>
        <h2>ARCOS</h2>
      </div>
      <p>Warehouse of Workforce</p>
    </div>

    <div class="app-body">
      <!-- Login Box -->
      <div id="loginBox">
        <div class="input-group">
          <label>Employee Identifier</label>
          <input type="text" id="empId" placeholder="e.g. ARS300248">
        </div>
        <div class="input-group">
          <label>Security Password</label>
          <input type="password" id="password" placeholder="••••••••">
        </div>
        <button class="btn-action" onclick="loginUser()">Sign In to Portal</button>
      </div>

      <!-- Main Action Portal -->
      <div id="actionBox" style="display:none;">
        <div class="clock-badge" id="liveClock">IST Time Synchronizing...</div>

        <h3 id="welcomeUser" style="font-size: 18px; font-weight:800; color:var(--text-white);">Welcome</h3>
        <p style="font-size:12px; color:var(--text-muted); margin-bottom:16px;">Mark your geo-attendance below</p>

        <!-- Circular Camera Box -->
        <div id="cameraBox">
          <video id="webcam" autoplay playsinline></video>
          <div id="timer">3</div>
        </div>
        <canvas id="canvas" width="320" height="240"></canvas>

        <button id="btnIn" class="btn-action" onclick="handlePunch('punchIn')">PUNCH IN NOW</button>
        <button id="btnOut" class="btn-action btn-out" onclick="handlePunch('punchOut')" style="display:none;">PUNCH OUT NOW</button>
        <div id="statusMsg" style="text-align:center; font-size:12px; font-weight:800; color:var(--arcos-yellow); margin-top:10px;"></div>

        <!-- Today Summary Card -->
        <div class="today-card">
          <div class="today-stat">
            <span>Today IN</span>
            <strong id="todayInTime">--:--</strong>
          </div>
          <div class="today-stat">
            <span>Today OUT</span>
            <strong id="todayOutTime">--:--</strong>
          </div>
        </div>

        <!-- Roster Calendar Trigger -->
        <button class="btn-roster" onclick="openRosterModal()">
          ▼ VIEW MONTHLY ROSTER & CALENDAR ▼
        </button>
      </div>
    </div>

    <!-- Corporate Footer -->
    <div class="app-footer">
      <span>POWERED BY ARCOS WORKFORCE MANAGEMENT SYSTEM</span>
    </div>
  </div>

  <!-- Calendar Roster Modal -->
  <div class="modal" id="rosterModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="calendarMonthTitle">Monthly Roster</h3>
        <span class="close-btn" onclick="closeRosterModal()">&times;</span>
      </div>

      <div class="calendar-grid" id="calendarGrid"></div>

      <!-- Date Record Detail Popup -->
      <div class="detail-card" id="dateDetailsBox" style="display:none;">
        <h4 id="selectedDateTitle" style="font-size:12px; font-weight:800; text-align:center; margin-bottom:10px; text-transform:uppercase; color: var(--arcos-yellow);">Record Details</h4>
        
        <div class="detail-row">
          <div>
            <strong>IN:</strong> <span id="dtInTime">N/A</span>
          </div>
          <div id="dtInImgBox"></div>
        </div>

        <div class="detail-row">
          <div>
            <strong>OUT:</strong> <span id="dtOutTime">N/A</span>
          </div>
          <div id="dtOutImgBox"></div>
        </div>

        <button class="btn-query" id="btnQuery" onclick="promptRaiseQuery()">🚨 Attendance Wrong? Raise Query to Admin</button>
      </div>
    </div>
  </div>

  <!-- Backend Integration Logic -->
  <script>
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxmZTB0kT0aiMhu0ah1cICCo-MwWdrUS_CsRX6WGHIsLINWL3kkF6Bv7g4zsjiIqF-h/exec';
    let currentEmpId = '';
    let attendanceHistory = [];
    let selectedDateForQuery = '';

    function updateClock() {
      const now = new Date();
      const options = { timeZone: 'Asia/Kolkata', weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
      const clockElem = document.getElementById('liveClock');
      if (clockElem) clockElem.innerText = '🇮🇳 ' + now.toLocaleString('en-IN', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    function getAccurateLocation() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          alert("GPS Support Not Available!");
          return resolve(null);
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
          (err) => { alert("Location Permission Denied!"); resolve(null); },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      });
    }

    async function loginUser() {
      const empId = document.getElementById('empId').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!empId || !password) return alert('Please enter credentials!');

      const res = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'validateUser', empId, password }) });
      const data = await res.json();

      if (data.success) {
        currentEmpId = empId;
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('actionBox').style.display = 'block';
        document.getElementById('welcomeUser').innerText = 'Welcome, ' + data.name;
        loadMyRecords();
      } else { alert(data.message); }
    }

    async function capturePhoto() {
      const cameraBox = document.getElementById('cameraBox'), video = document.getElementById('webcam'), timer = document.getElementById('timer'), canvas = document.getElementById('canvas');
      cameraBox.style.display = 'block';
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream; await video.play();

        return new Promise((resolve) => {
          let count = 3; timer.innerText = count;
          const countdown = setInterval(() => {
            count--;
            if (count > 0) { timer.innerText = count; } 
            else {
              clearInterval(countdown);
              canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
              stream.getTracks().forEach(t => t.stop());
              cameraBox.style.display = 'none';
              resolve(canvas.toDataURL('image/jpeg', 0.6));
            }
          }, 1000);
        });
      } catch (err) {
        alert('Camera Access Required!');
        cameraBox.style.display = 'none';
        return '';
      }
    }

    async function handlePunch(type) {
      const btnIn = document.getElementById('btnIn'), btnOut = document.getElementById('btnOut'), statusMsg = document.getElementById('statusMsg');
      btnIn.disabled = true; btnOut.disabled = true;
      statusMsg.innerText = "Fetching GPS Location...";

      const coords = await getAccurateLocation();
      if (!coords) { statusMsg.innerText = ""; btnIn.disabled = false; btnOut.disabled = false; return; }

      statusMsg.innerText = "Capturing Photo...";
      const photoBase64 = await capturePhoto();
      if (!photoBase64) { statusMsg.innerText = ""; btnIn.disabled = false; btnOut.disabled = false; return; }

      statusMsg.innerText = "Saving Attendance...";
      const mapRoute = `https://www.google.com/maps?q=${coords.lat},${coords.lng}`;

      const res = await fetch(GOOGLE_SCRIPT_URL, { 
        method: 'POST', 
        body: JSON.stringify({ action: type, empId: currentEmpId, photoUrl: photoBase64, mapRoute: mapRoute, lat: coords.lat, lng: coords.lng }) 
      });
      const data = await res.json();

      statusMsg.innerText = ""; btnIn.disabled = false; btnOut.disabled = false;

      if (data.success) {
        alert(type === 'punchIn' ? 'Punched IN Successfully!' : 'Punched OUT Successfully!');
        loadMyRecords();
      } else { alert(data.message); }
    }

    async function loadMyRecords() {
      const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getAttendanceRecords&empId=${currentEmpId}`);
      const data = await res.json();

      if (data.success && data.records) {
        attendanceHistory = data.records;
        updateTodayStatus();
      }
    }

    function updateTodayStatus() {
      const todayIST = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
      const todayRecord = attendanceHistory.find(r => r.date === todayIST);

      const btnIn = document.getElementById('btnIn');
      const btnOut = document.getElementById('btnOut');

      if (todayRecord) {
        document.getElementById('todayInTime').innerText = todayRecord.inTime || '--:--';
        document.getElementById('todayOutTime').innerText = todayRecord.outTime || '--:--';

        if (todayRecord.inTime && !todayRecord.outTime) {
          btnIn.style.display = 'none';
          btnOut.style.display = 'block';
        } else {
          btnIn.style.display = 'block';
          btnOut.style.display = 'none';
        }
      } else {
        document.getElementById('todayInTime').innerText = '--:--';
        document.getElementById('todayOutTime').innerText = '--:--';
        btnIn.style.display = 'block';
        btnOut.style.display = 'none';
      }
    }

    function openRosterModal() {
      document.getElementById('rosterModal').style.display = 'flex';
      renderCalendar();
    }

    function closeRosterModal() {
      document.getElementById('rosterModal').style.display = 'none';
      document.getElementById('dateDetailsBox').style.display = 'none';
    }

    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();

      document.getElementById('calendarMonthTitle').innerText = now.toLocaleString('en-IN', { month: 'long', year: 'numeric' });

      const daysHeader = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      daysHeader.forEach(d => { grid.innerHTML += `<div class="cal-head">${d}</div>`; });

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const todayStr = now.toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });

      for (let i = 0; i < firstDay; i++) { grid.innerHTML += `<div></div>`; }

      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const record = attendanceHistory.find(r => r.date === dateStr);
        const isFuture = dateStr > todayStr;

        let dayClass = 'disabled';
        let badge = '';

        if (isFuture) {
          dayClass = 'disabled';
        } else if (record && record.inTime) {
          dayClass = 'present';
          badge = `<div class="badge-status badge-p">P</div>`;
        } else {
          dayClass = 'absent';
          badge = `<div class="badge-status badge-a">A</div>`;
        }

        let onClickAttr = !isFuture ? `onclick="showDateDetail('${dateStr}')"` : '';
        grid.innerHTML += `
          <div class="cal-day ${dayClass}" ${onClickAttr}>
            <span>${day}</span>
            ${badge}
          </div>
        `;
      }
    }

    function showDateDetail(dateStr) {
      selectedDateForQuery = dateStr;
      const record = attendanceHistory.find(r => r.date === dateStr);
      const detailBox = document.getElementById('dateDetailsBox');
      document.getElementById('selectedDateTitle').innerText = 'Date: ' + dateStr;

      if (record && record.inTime) {
        document.getElementById('dtInTime').innerText = record.inTime || 'N/A';
        document.getElementById('dtOutTime').innerText = record.outTime || 'N/A';
        document.getElementById('dtInImgBox').innerHTML = record.inPhoto ? `<img src="${record.inPhoto}" class="detail-thumb">` : '';
        document.getElementById('dtOutImgBox').innerHTML = record.outPhoto ? `<img src="${record.outPhoto}" class="detail-thumb">` : '';
      } else {
        document.getElementById('dtInTime').innerText = 'ABSENT';
        document.getElementById('dtOutTime').innerText = 'ABSENT';
        document.getElementById('dtInImgBox').innerHTML = '';
        document.getElementById('dtOutImgBox').innerHTML = '';
      }
      detailBox.style.display = 'block';
    }

    async function promptRaiseQuery() {
      const issue = prompt(`Describe issue for ${selectedDateForQuery}:`);
      if (!issue) return;

      const res = await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'raiseQuery', empId: currentEmpId, date: selectedDateForQuery, issue: issue })
      });
      const data = await res.json();

      if (data.success) {
        alert(`Query Submitted! Ticket ID: ${data.ticketId}`);
      } else { alert("Failed to submit query."); }
    }
  </script>
</body>
</html>
