<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Portal - Attendance</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background: #f0f3f8; color: #1e293b; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
    .app-card { background: #ffffff; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.06); width: 100%; max-width: 460px; overflow: hidden; border: 1px solid #e2e8f0; }
    .app-header { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; padding: 25px; text-align: center; }
    .app-header h2 { font-size: 20px; font-weight: 700; }
    .app-body { padding: 20px; }
    input { width: 100%; padding: 14px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 14px; outline: none; }
    button { width: 100%; padding: 14px; border: none; border-radius: 12px; background: #2563eb; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:hover { background: #1d4ed8; }
    .btn-out { background: #dc2626; display: none; margin-top: 10px; }
    .btn-out:hover { background: #b91c1c; }
    
    #cameraBox { display: none; margin: 15px 0; background: #000; border-radius: 16px; overflow: hidden; position: relative; }
    video { width: 100%; height: 220px; object-fit: cover; }
    #timer { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 52px; color: white; font-weight: 800; text-shadow: 0 0 12px rgba(0,0,0,0.8); }
    canvas { display: none; }

    .history-section { margin-top: 25px; border-top: 1px dashed #e2e8f0; padding-top: 20px; }
    .history-title { font-weight: 700; font-size: 15px; color: #0f172a; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .history-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .history-table th { background: #f8fafc; color: #64748b; font-size: 11px; text-transform: uppercase; padding: 10px 8px; text-align: left; }
    .history-table td { padding: 10px 8px; font-size: 12px; border-bottom: 1px solid #f1f5f9; color: #334155; }
    .thumb-img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; border: 1px solid #2563eb; display: block; margin-top: 4px; }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="app-header">
      <h2>Attendance Portal</h2>
    </div>
    
    <div class="app-body">
      <div id="loginBox">
        <input type="text" id="empId" placeholder="Employee ID (e.g. ARS115437)">
        <input type="password" id="password" placeholder="Password">
        <button onclick="loginUser()">Sign In</button>
      </div>

      <div id="actionBox" style="display:none;">
        <h3 id="welcomeUser" style="color:#0f172a; font-size: 16px; font-weight:700;">Welcome</h3>
        <p style="color:#64748b; font-size:12px; margin-bottom:15px;">Mark your daily attendance below</p>

        <div id="cameraBox">
          <video id="webcam" autoplay playsinline></video>
          <div id="timer">3</div>
        </div>
        <canvas id="canvas" width="320" height="240"></canvas>

        <button id="btnIn" onclick="handlePunch('punchIn')">Punch IN</button>
        <button id="btnOut" class="btn-out" onclick="handlePunch('punchOut')">Punch OUT</button>

        <div class="history-section">
          <div class="history-title">
            <span>My Attendance Records</span>
            <button onclick="loadMyRecords()" style="width:auto; padding:6px 12px; font-size:11px; background:#f1f5f9; color:#334155;">Refresh</button>
          </div>
          <div style="overflow-x:auto;">
            <table class="history-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>In</th>
                  <th>Out</th>
                </tr>
              </thead>
              <tbody id="myHistoryBody">
                <tr><td colspan="3" style="text-align:center;">Loading logs...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyXtBaxacajp-ETxTvgx6UgtMeqwnWWtNmUvL78xQ6TziRjpiOsL6zyVqOsBRdzR2vn/exec';
    let currentEmpId = '', userLocation = { lat: '', lng: '' };

    async function loginUser() {
      const empId = document.getElementById('empId').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!empId || !password) return alert('Enter credentials!');

      const res = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'validateUser', empId, password }) });
      const data = await res.json();

      if (data.success) {
        currentEmpId = empId;
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('actionBox').style.display = 'block';
        document.getElementById('welcomeUser').innerText = 'Welcome, ' + data.name;
        
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(pos => { userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude }; });
        }
        loadMyRecords();
      } else { alert(data.message); }
    }

    async function capturePhoto() {
      const cameraBox = document.getElementById('cameraBox'), video = document.getElementById('webcam'), timer = document.getElementById('timer'), canvas = document.getElementById('canvas');
      cameraBox.style.display = 'block';
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream; await video.play();

        return new Promise((resolve) => {
          let count = 3; timer.innerText = count;
          const countdown = setInterval(() => {
            count--;
            if (count > 0) { timer.innerText = count; } 
            else {
              clearInterval(countdown);
              canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
              stream.getTracks().forEach(t => t.stop());
              cameraBox.style.display = 'none';
              resolve(canvas.toDataURL('image/jpeg', 0.6));
            }
          }, 1000);
        });
      } catch (err) {
        alert('Camera Permission Required!');
        cameraBox.style.display = 'none';
        return '';
      }
    }

    async function handlePunch(type) {
      const photoBase64 = await capturePhoto();
      if (!photoBase64) return alert("Photo missing!");

      const mapRoute = `https://www.google.com/maps?q=${userLocation.lat},${userLocation.lng}`;
      const res = await fetch(GOOGLE_SCRIPT_URL, { 
        method: 'POST', 
        body: JSON.stringify({ action: type, empId: currentEmpId, photoUrl: photoBase64, mapRoute }) 
      });
      const data = await res.json();

      if (data.success) {
        if (type === 'punchIn') {
          document.getElementById('btnIn').style.display = 'none';
          document.getElementById('btnOut').style.display = 'block';
          alert('Punched IN Successfully!');
        } else {
          document.getElementById('btnOut').style.display = 'none';
          alert('Punched OUT Successfully!');
        }
        loadMyRecords();
      } else { alert(data.message); }
    }

    async function loadMyRecords() {
      const tbody = document.getElementById('myHistoryBody');
      const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getAttendanceRecords&empId=${currentEmpId}`);
      const data = await res.json();

      if (data.success && data.records.length > 0) {
        tbody.innerHTML = '';
        data.records.forEach(r => {
          let inImg = r.inPhoto && r.inPhoto.startsWith('http') ? `<br><a href="${r.inPhoto}" target="_blank"><img src="${r.inPhoto}" class="thumb-img"></a>` : '';
          let outImg = r.outPhoto && r.outPhoto.startsWith('http') ? `<br><a href="${r.outPhoto}" target="_blank"><img src="${r.outPhoto}" class="thumb-img"></a>` : '';

          tbody.innerHTML += `
            <tr>
              <td><b>${r.date}</b></td>
              <td>${r.inTime || '-'}${inImg}</td>
              <td>${r.outTime || '-'}${outImg}</td>
            </tr>
          `;
        });
      } else { tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">No records found.</td></tr>'; }
    }
  </script>
</body>
</html>
